<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Multi-panel analytics dashboard showing blockchain transaction graphs">
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A12"/>
      <stop offset="0.6" stop-color="#0C1628"/>
      <stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <linearGradient id="d-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D07A"/>
      <stop offset="1" stop-color="#B98A2A"/>
    </linearGradient>
    <linearGradient id="d-chart" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#60A5FA" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="d-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="d-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#60A5FA" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#d-bg)"/>
  <rect width="1200" height="750" fill="url(#d-grid)"/>
  <ellipse cx="600" cy="400" rx="480" ry="320" fill="url(#d-glow)"/>

  <!-- header bar -->
  <rect x="72" y="80" width="1056" height="58" rx="14" fill="#0A0D16" stroke="#E8C266" stroke-opacity="0.28" stroke-width="1.5"/>
  <text x="104" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#E8C266">BLOCKCHAIN/INTEL</text>
  <g fill="#4ADE80">
    <circle cx="1040" cy="109" r="5"/>
  </g>
  <text x="1060" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2" fill="#60A5FA" fill-opacity="0.8">LIVE</text>

  <!-- main chart panel -->
  <g>
    <rect x="72" y="168" width="680" height="450" rx="16" fill="#0A0C14" stroke="#60A5FA" stroke-opacity="0.28" stroke-width="1.5"/>
    <text x="104" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#8B94A8">Transaction Volume / 24h</text>

    <!-- y-axis labels -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4A5265" text-anchor="end">
      <text x="128" y="256">1.2M</text>
      <text x="128" y="336">800K</text>
      <text x="128" y="416">400K</text>
      <text x="128" y="496">200K</text>
      <text x="128" y="576">0</text>
    </g>

    <!-- grid lines -->
    <g stroke="#60A5FA" stroke-opacity="0.08" stroke-width="1">
      <path d="M140 250h588M140 330h588M140 410h588M140 490h588M140 570h588"/>
    </g>

    <!-- area chart -->
    <path d="M140 570 160 540 200 520 260 480 320 450 380 420 440 460 500 420 560 380 620 360 680 320 728 280V570Z" fill="url(#d-chart)" opacity="0.85"/>
    <path d="M140 570 160 540 200 520 260 480 320 450 380 420 440 460 500 420 560 380 620 360 680 320 728 280" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>

    <!-- data points -->
    <g fill="#60A5FA">
      <circle cx="260" cy="480" r="4"/><circle cx="380" cy="420" r="4"/>
      <circle cx="500" cy="420" r="4"/><circle cx="620" cy="360" r="4"/>
    </g>

    <!-- x-axis labels -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4A5265" text-anchor="middle">
      <text x="200" y="600">00:00</text><text x="320" y="600">04:00</text>
      <text x="440" y="600">08:00</text><text x="560" y="600">12:00</text>
      <text x="680" y="600">16:00</text>
    </g>
  </g>

  <!-- stat cards -->
  <g>
    <rect x="780" y="168" width="348" height="128" rx="16" fill="#0A0C14" stroke="#E8C266" stroke-opacity="0.28" stroke-width="1.5"/>
    <text x="812" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#8B94A8">MONITORED WALLETS</text>
    <text x="812" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="42" letter-spacing="1" fill="url(#d-gold)">2,847</text>
    <text x="812" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4ADE80">+124 this week</text>
  </g>

  <g>
    <rect x="780" y="316" width="348" height="128" rx="16" fill="#0A0C14" stroke="#60A5FA" stroke-opacity="0.28" stroke-width="1.5"/>
    <text x="812" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#8B94A8">ALERTS TRIGGERED</text>
    <text x="812" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="42" letter-spacing="1" fill="#60A5FA">38</text>
    <text x="812" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#F87171">5 HIGH SEVERITY</text>
  </g>

  <g>
    <rect x="780" y="464" width="348" height="154" rx="16" fill="#0A0C14" stroke="#60A5FA" stroke-opacity="0.22" stroke-width="1.5"/>
    <text x="812" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#8B94A8">RECENT EVENTS</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <circle cx="824" cy="534" r="3" fill="#4ADE80"/>
      <text x="842" y="538" fill="#8B94A8">Large transfer detected 0x3f2a</text>

      <circle cx="824" cy="564" r="3" fill="#E8C266"/>
      <text x="842" y="568" fill="#8B94A8">New contract deployed 0x8b1c</text>

      <circle cx="824" cy="594" r="3" fill="#60A5FA"/>
      <text x="842" y="598" fill="#8B94A8">Wallet activated 0x5d9e</text>
    </g>
  </g>

  <text x="72" y="682" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3" fill="#60A5FA" fill-opacity="0.6">REAL-TIME ANALYTICS · ON-CHAIN FORENSICS</text>
</svg>
