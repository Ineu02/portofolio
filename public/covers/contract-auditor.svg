<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Solidity source with an audit shield and severity findings">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080B"/>
      <stop offset="0.6" stop-color="#0E1118"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <linearGradient id="a-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D07A"/>
      <stop offset="1" stop-color="#B98A2A"/>
    </linearGradient>
    <radialGradient id="a-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C266" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E8C266" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#a-bg)"/>
  <ellipse cx="760" cy="375" rx="420" ry="330" fill="url(#a-glow)"/>

  <!-- editor pane -->
  <g>
    <rect x="72" y="120" width="620" height="510" rx="20" fill="#0A0C12" stroke="#E8C266" stroke-opacity="0.28" stroke-width="1.5"/>
    <rect x="72" y="120" width="620" height="46" rx="20" fill="#12151E"/>
    <rect x="72" y="150" width="620" height="16" fill="#12151E"/>
    <g fill="#E8C266" fill-opacity="0.55">
      <circle cx="104" cy="143" r="5"/><circle cx="124" cy="143" r="5"/><circle cx="144" cy="143" r="5"/>
    </g>
    <text x="176" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2" fill="#8B94A8">Vault.sol</text>

    <!-- gutter -->
    <rect x="72" y="166" width="46" height="464" fill="#0C0E15"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4A5265" text-anchor="end">
      <text x="106" y="208">41</text><text x="106" y="240">42</text><text x="106" y="272">43</text>
      <text x="106" y="304">44</text><text x="106" y="336">45</text><text x="106" y="368">46</text>
      <text x="106" y="400">47</text><text x="106" y="432">48</text><text x="106" y="464">49</text>
      <text x="106" y="496">50</text><text x="106" y="528">51</text><text x="106" y="560">52</text>
    </g>

    <!-- flagged line -->
    <rect x="118" y="384" width="574" height="30" fill="#E8C266" fill-opacity="0.09"/>
    <rect x="118" y="384" width="3" height="30" fill="#E8C266"/>

    <!-- code as abstract token bars -->
    <g rx="3">
      <rect x="142" y="197" width="118" height="10" rx="5" fill="#C4A0F7" fill-opacity="0.75"/>
      <rect x="270" y="197" width="86" height="10" rx="5" fill="#60A5FA" fill-opacity="0.65"/>
      <rect x="366" y="197" width="54" height="10" rx="5" fill="#4A5265"/>

      <rect x="166" y="229" width="72" height="10" rx="5" fill="#E8C266" fill-opacity="0.8"/>
      <rect x="248" y="229" width="140" height="10" rx="5" fill="#4A5265"/>

      <rect x="166" y="261" width="104" height="10" rx="5" fill="#60A5FA" fill-opacity="0.65"/>
      <rect x="280" y="261" width="62" height="10" rx="5" fill="#4A5265"/>
      <rect x="352" y="261" width="92" height="10" rx="5" fill="#C4A0F7" fill-opacity="0.6"/>

      <rect x="190" y="293" width="130" height="10" rx="5" fill="#4A5265"/>
      <rect x="330" y="293" width="58" height="10" rx="5" fill="#E8C266" fill-opacity="0.6"/>

      <rect x="190" y="325" width="88" height="10" rx="5" fill="#60A5FA" fill-opacity="0.5"/>
      <rect x="288" y="325" width="112" height="10" rx="5" fill="#4A5265"/>

      <rect x="142" y="357" width="66" height="10" rx="5" fill="#C4A0F7" fill-opacity="0.7"/>

      <rect x="190" y="394" width="164" height="10" rx="5" fill="#F0D07A"/>
      <rect x="364" y="394" width="88" height="10" rx="5" fill="#F0D07A" fill-opacity="0.7"/>

      <rect x="166" y="425" width="98" height="10" rx="5" fill="#4A5265"/>
      <rect x="274" y="425" width="72" height="10" rx="5" fill="#60A5FA" fill-opacity="0.55"/>

      <rect x="166" y="457" width="132" height="10" rx="5" fill="#4A5265"/>
      <rect x="142" y="489" width="54" height="10" rx="5" fill="#C4A0F7" fill-opacity="0.6"/>
      <rect x="166" y="521" width="108" height="10" rx="5" fill="#4A5265"/>
      <rect x="142" y="553" width="40" height="10" rx="5" fill="#4A5265"/>
    </g>
  </g>

  <!-- audit shield -->
  <g transform="translate(900 300)">
    <path d="M0 0 96 34v78c0 60-41 103-96 119-55-16-96-59-96-119V34Z" fill="#07080C" stroke="url(#a-gold)" stroke-width="3"/>
    <path d="M0 0 96 34v78c0 60-41 103-96 119-55-16-96-59-96-119V34Z" fill="none" stroke="#E8C266" stroke-opacity="0.18" stroke-width="12"/>
    <g stroke="url(#a-gold)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-34 108 -10 132 36 74"/>
    </g>
  </g>

  <!-- severity chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2">
    <g>
      <rect x="780" y="560" width="112" height="38" rx="10" fill="#1A0E0E" stroke="#F87171" stroke-opacity="0.6"/>
      <text x="800" y="585" fill="#F87171">HIGH 1</text>
    </g>
    <g>
      <rect x="906" y="560" width="112" height="38" rx="10" fill="#1A1408" stroke="#E8C266" stroke-opacity="0.6"/>
      <text x="924" y="585" fill="#E8C266">MED 3</text>
    </g>
    <g>
      <rect x="1032" y="560" width="96" height="38" rx="10" fill="#0C1420" stroke="#60A5FA" stroke-opacity="0.6"/>
      <text x="1048" y="585" fill="#60A5FA">LOW 7</text>
    </g>
  </g>

  <text x="780" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="3" fill="#E8C266" fill-opacity="0.85">AUDIT/STATIC</text>
</svg>
