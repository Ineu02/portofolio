<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ecc4"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a07d24"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#050505"/>
  <!--
    Stroked "B" for Bandidoz, in the same weight and gold gradient as the rest of
    the mark. This was an "A" while the site's display name was a different one;
    a favicon is the one piece of branding that shows up detached from the page,
    so leaving it on the old initial would have been the most visible leftover of
    the rename. Stem plus two right-bulging bowls, the lower one slightly wider,
    drawn as arcs of radius 7 whose endpoints are 2r apart so each closes cleanly.
  -->
  <path d="M22 18 V46 M22 18 H32 A7 7 0 0 1 32 32 H22 M22 32 H34 A7 7 0 0 1 34 46 H22"
        fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
